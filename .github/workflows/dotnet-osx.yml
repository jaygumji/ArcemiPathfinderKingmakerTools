# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Create OSX Version

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Build and Test
      run: |
        dotnet restore Arcemi.SaveGameEditor.sln
        dotnet build Arcemi.SaveGameEditor.sln -c Release --no-restore
        dotnet test Arcemi.Tests/Arcemi.Tests.csproj -c Release --no-build
    - name: Publish OSX package
      working-directory: ./Arcemi.SaveGameEditor
      run: dotnet publish -c Release /p:ElectronTarget=custom /p:ElectronBuildTarget=osx /p:ElectronPlatform=darwin /p:ElectronArch=x64 /p:ElectronPublishReadyToRun=false /p:ElectronPublishSingleFile=false
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arcemi-SaveGameEditor-OSX
        path: ./Arcemi.SaveGameEditor/bin/Desktop/Arcemi Save Game Editor-*.dmg
