# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Create Linux Version

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - name: Build and Test
      run: |
        dotnet restore Arcemi.SaveGameEditor.sln
        dotnet build Arcemi.SaveGameEditor.sln -c Release --no-restore
        dotnet test Arcemi.Tests/Arcemi.Tests.csproj -c Release --no-build
    - name: Publish Linux package
      working-directory: ./Arcemi.SaveGameEditor
      run: dotnet publish -c Release -r linux-x64 --self-contained -p:PublishUrl=bin/Desktop
    - name: Upload Artifact Setup
      uses: actions/upload-artifact@v4
      with:
        name: Arcemi-SaveGameEditor-Linux
        path: ./Arcemi.SaveGameEditor/bin/Desktop/Arcemi Save Game Editor-*.AppImage
        if-no-files-found: error
