# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Create Windows Version

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - name: Build and Test
      run: |
        dotnet restore Arcemi.SaveGameEditor.sln
        dotnet build Arcemi.SaveGameEditor.sln -c Release --no-restore
        dotnet test Arcemi.Tests/Arcemi.Tests.csproj -c Release --no-build
    - name: Publish Windows package
      working-directory: ./Arcemi.SaveGameEditor
      run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishUrl=bin/Desktop
    - name: Upload Artifact Setup
      uses: actions/upload-artifact@v4
      with:
        name: Arcemi-SaveGameEditor-Windows-Setup
        path: ./Arcemi.SaveGameEditor/bin/Desktop/Arcemi Save Game Editor Setup *.exe
        if-no-files-found: error
    - name: Upload Artifact Archive
      uses: actions/upload-artifact@v4
      with:
        name: Arcemi-SaveGameEditor-Windows-Archive
        path: ./Arcemi.SaveGameEditor/bin/Desktop/win-unpacked/*
        if-no-files-found: error
